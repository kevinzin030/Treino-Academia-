<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treino Semanal - PPL</title>
  <style>
    :root {
      --bg: #0b0b0f;
      --card: #15151c;
      --card-2: #1d1d26;
      --text: #f5f5f5;
      --muted: #a6a6b0;
      --blue: #1677ff;
      --green: #16b96b;
      --orange: #ff914d;
      --red: #c92d3f;
      --purple: #7c3aed;
      --border: rgba(255,255,255,.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, rgba(124,58,237,.12), transparent 35%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
      padding: 30px 0 50px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 3.5rem);
      letter-spacing: -1px;
    }

    h1 span {
      color: var(--purple);
    }

    .subtitle {
      color: var(--muted);
      margin: 0;
    }

    .week-progress {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 25px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .progress-bar {
      height: 10px;
      background: #292932;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--purple), #a855f7);
      transition: width .3s ease;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .day {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 35px rgba(0,0,0,.18);
    }

    .day-header {
      padding: 20px 22px;
      border-bottom: 1px solid var(--border);
    }

    .day-header h2 {
      margin: 0 0 5px;
      font-size: 1.7rem;
    }

    .day-header p {
      margin: 0;
      color: var(--muted);
      font-size: .92rem;
      font-weight: bold;
    }

    .monday .day-header h2 { color: var(--blue); }
    .tuesday .day-header h2 { color: var(--green); }
    .wednesday .day-header h2 { color: var(--orange); }
    .friday .day-header h2 { color: var(--red); }
    .saturday .day-header h2 { color: var(--purple); }

    .exercises {
      padding: 8px 18px 18px;
    }

    .exercise {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 4px;
      border-bottom: 1px solid rgba(255,255,255,.055);
      cursor: pointer;
      transition: .2s;
    }

    .exercise:last-child { border-bottom: 0; }

    .exercise:hover {
      background: rgba(255,255,255,.025);
    }

    .exercise input {
      width: 21px;
      height: 21px;
      accent-color: var(--purple);
      cursor: pointer;
      flex-shrink: 0;
    }

    .exercise-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
    }

    .exercise-name {
      font-weight: bold;
      line-height: 1.3;
    }

    .sets {
      color: var(--muted);
      font-size: .82rem;
      white-space: nowrap;
    }

    .exercise.done .exercise-name {
      text-decoration: line-through;
      color: #777783;
    }

    .day-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 0 22px 20px;
      color: var(--muted);
      font-size: .85rem;
    }

    .complete-badge {
      display: none;
      color: #4ade80;
      font-weight: bold;
    }

    .day.completed .complete-badge {
      display: block;
    }

    .rest {
      grid-column: span 2;
      background: linear-gradient(135deg, #15151c, #101016);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      text-align: center;
    }

    .rest strong {
      color: var(--muted);
    }

    .motivation {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(6px);
      opacity: 0;
      visibility: hidden;
      transition: .25s;
      z-index: 10;
    }

    .motivation.show {
      opacity: 1;
      visibility: visible;
    }

    .motivation-card {
      width: min(480px, 100%);
      background: #181820;
      border: 1px solid rgba(168,85,247,.35);
      border-radius: 24px;
      padding: 32px 25px;
      text-align: center;
      box-shadow: 0 25px 80px rgba(0,0,0,.5);
      transform: translateY(15px) scale(.97);
      transition: .25s;
    }

    .motivation.show .motivation-card {
      transform: translateY(0) scale(1);
    }

    .motivation-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .motivation h2 {
      margin: 0 0 10px;
      font-size: 1.7rem;
    }

    .motivation p {
      color: #c8c8d0;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 22px;
      font-weight: bold;
      color: white;
      background: var(--purple);
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover { filter: brightness(1.12); }

    .reset {
      display: block;
      margin: 25px auto 0;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: .9rem;
    }

    @media (max-width: 750px) {
      .grid { grid-template-columns: 1fr; }
      .rest { grid-column: span 1; }
      .container { width: 94%; padding-top: 20px; }
      .day-header { padding: 18px; }
      .day-footer { padding: 0 18px 18px; }
      .exercise-info { align-items: flex-start; }
      .sets { font-size: .76rem; }
    }

    @media (max-width: 430px) {
      .exercise {
        gap: 9px;
        padding: 12px 0;
      }

      .exercise-info {
        display: block;
      }

      .sets {
        display: block;
        margin-top: 3px;
      }
    }
  </style>
</head>
<body>

  <main class="container">
    <header>
      <h1>TREINO SEMANAL - <span>PPL</span></h1>
      <p class="subtitle">Marque cada exercício conforme concluir. Seu progresso fica salvo neste dispositivo.</p>
    </header>

    <section class="week-progress">
      <div class="progress-top">
        <span>Progresso da semana</span>
        <span id="progressText">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </section>

    <section class="grid" id="workoutGrid"></section>

    <button class="reset" id="resetBtn">↻ Resetar todos os exercícios</button>
  </main>

  <div class="motivation" id="motivation">
    <div class="motivation-card">
      <div class="motivation-icon">🔥</div>
      <h2>Treino concluído!</h2>
      <p id="motivationText"></p>
      <button id="closeMotivation">Continuar</button>
    </div>
  </div>

  <script>
    const workouts = [
      {
        id: "segunda",
        day: "SEGUNDA",
        title: "PUSH - (PEITO, OMBRO E TRÍCEPS)",
        className: "monday",
        exercises: [
          ["Supino reto com barra", "4x"],
          ["Supino inclinado com barra", "4x"],
          ["Crossover polia alta", "3x"],
          ["Crossover polia baixa", "3x"],
          ["Elevação lateral sentado", "4x"],
          ["Desenvolvimento com halteres", "4x"],
          ["Tríceps na polia", "4x"]
        ]
      },
      {
        id: "terca",
        day: "TERÇA",
        title: "PULL - (COSTAS, POSTERIOR DE OMBRO E BÍCEPS)",
        className: "tuesday",
        exercises: [
          ["Puxada alta", "4x"],
          ["Remada baixa sentado", "4x"],
          ["Remada curvada", "4x"],
          ["Remada cavalinho", "3x"],
          ["Fly inverso", "3x"],
          ["Rosca direta barra W", "4x"],
          ["Rosca martelo na polia", "4x"]
        ]
      },
      {
        id: "quarta",
        day: "QUARTA",
        title: "LEGS - (QUADRÍCEPS, POSTERIOR E GLÚTEOS)",
        className: "wednesday",
        exercises: [
          ["Agachamento livre", "4x"],
          ["Leg Press 45", "4x"],
          ["Cadeira extensora", "4x"],
          ["Mesa flexora", "4x"],
          ["Stiff", "4x"],
          ["Elevação pélvica", "3x"],
          ["Panturrilha", "3x"]
        ]
      },
      {
        id: "sexta",
        day: "SEXTA",
        title: "UPPER - (SUPERIOR COMPLETO)",
        className: "friday",
        exercises: [
          ["Supino inclinado com halteres", "3x"],
          ["Supino reto com barra", "3x"],
          ["Puxada alta", "3x"],
          ["Remada baixa sentado", "3x"],
          ["Encolhimento com halteres", "3x"],
          ["Elevação frontal na polia", "3x"],
          ["Rosca martelo na polia", "3x"],
          ["Tríceps na polia", "3x"]
        ]
      },
      {
        id: "sabado",
        day: "SÁBADO",
        title: "LOWER - (INFERIOR COMPLETO)",
        className: "saturday",
        exercises: [
          ["Agachamento livre", "3x"],
          ["Leg Press 45", "3x"],
          ["Mesa flexora", "3x"],
          ["Stiff", "3x"],
          ["Elevação pélvica", "3x"],
          ["Panturrilha", "3x"]
        ]
      }
    ];

    const messages = [
      "Você terminou mais um treino. Disciplina vence motivação quando a motivação acaba. 🔥",
      "Mais um treino concluído! O resultado é construído exatamente assim: um treino de cada vez. 💪",
      "Missão cumprida! Você não precisa ser perfeito, só precisa continuar. 🚀",
      "Treino finalizado! Hoje você foi melhor do que ontem. Continue nessa pegada. 🏆",
      "Você fez acontecer. Consistência é o verdadeiro segredo. Agora descanse e volte ainda mais forte! ⚡"
    ];

    const storageKey = "treinoPPLProgresso";
    let state = JSON.parse(localStorage.getItem(storageKey) || "{}");

    function save() {
      localStorage.setItem(storageKey, JSON.stringify(state));
    }

    function render() {
      const grid = document.getElementById("workoutGrid");
      grid.innerHTML = "";

      workouts.forEach(workout => {
        const card = document.createElement("article");
        card.className = `day ${workout.className}`;

        const header = document.createElement("div");
        header.className = "day-header";
        header.innerHTML = `
          <h2>${workout.day}</h2>
          <p>${workout.title}</p>
        `;

        const exercises = document.createElement("div");
        exercises.className = "exercises";

        workout.exercises.forEach((exercise, index) => {
          const key = `${workout.id}-${index}`;
          const checked = !!state[key];

          const label = document.createElement("label");
          label.className = `exercise ${checked ? "done" : ""}`;
          label.innerHTML = `
            <input type="checkbox" ${checked ? "checked" : ""} data-key="${key}">
            <span class="exercise-info">
              <span class="exercise-name">${exercise[0]}</span>
              <span class="sets">${exercise[1]} séries</span>
            </span>
          `;

          exercises.appendChild(label);
        });

        const total = workout.exercises.length;
        const done = workout.exercises.filter((_, i) => state[`${workout.id}-${i}`]).length;

        const footer = document.createElement("div");
        footer.className = "day-footer";
        footer.innerHTML = `
          <span>${done}/${total} exercícios concluídos</span>
          <span class="complete-badge">✓ TREINO CONCLUÍDO</span>
        `;

        card.appendChild(header);
        card.appendChild(exercises);
        card.appendChild(footer);
        grid.appendChild(card);

        if (done === total) card.classList.add("completed");
      });

      document.querySelectorAll('input[type="checkbox"]').forEach(input => {
        input.addEventListener("change", handleCheck);
      });

      updateProgress();
    }

    function handleCheck(event) {
      const input = event.target;
      state[input.dataset.key] = input.checked;
      save();

      const label = input.closest(".exercise");
      label.classList.toggle("done", input.checked);

      updateWorkoutStatus(input.dataset.key);
      updateProgress();
    }

    function updateWorkoutStatus(changedKey) {
      const workout = workouts.find(w => changedKey.startsWith(w.id + "-"));
      if (!workout) return;

      const complete = workout.exercises.every((_, index) =>
        !!state[`${workout.id}-${index}`]
      );

      const card = document.querySelector(`.${workout.className}`);
      if (card) card.classList.toggle("completed", complete);

      if (complete) {
        showMotivation();
      }
    }

    function updateProgress() {
      const total = workouts.reduce((sum, w) => sum + w.exercises.length, 0);
      const done = workouts.reduce((sum, w) =>
        sum + w.exercises.filter((_, i) => state[`${w.id}-${i}`]).length, 0
      );

      const percent = total ? Math.round((done / total) * 100) : 0;
      document.getElementById("progressText").textContent = `${percent}%`;
      document.getElementById("progressFill").style.width = `${percent}%`;
    }

    function showMotivation() {
      const message = messages[Math.floor(Math.random() * messages.length)];
      document.getElementById("motivationText").textContent = message;
      document.getElementById("motivation").classList.add("show");
    }

    document.getElementById("closeMotivation").addEventListener("click", () => {
      document.getElementById("motivation").classList.remove("show");
    });

    document.getElementById("motivation").addEventListener("click", event => {
      if (event.target.id === "motivation") {
        event.currentTarget.classList.remove("show");
      }
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (confirm("Tem certeza que deseja resetar todos os exercícios?")) {
        state = {};
        save();
        render();
      }
    });

    render();
  </script>
</body>
</html>
