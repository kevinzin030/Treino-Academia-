<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treino PPL - Login</title>
<style>
:root{
  --bg:#08080c;--card:#15151d;--card2:#1d1d27;--text:#f5f5f7;
  --muted:#9999a7;--purple:#8b5cf6;--purple2:#a855f7;
  --green:#16b96b;--danger:#ff4d67;--border:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
body{
  margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);
  color:var(--text);min-height:100vh;
}
.screen{min-height:100vh}
.hidden{display:none!important}

/* LOGIN */
.login-screen{
  display:flex;align-items:center;justify-content:center;padding:25px;
  background:
    radial-gradient(circle at 20% 20%,rgba(139,92,246,.18),transparent 32%),
    radial-gradient(circle at 80% 80%,rgba(168,85,247,.12),transparent 32%),var(--bg);
}
.login-card{
  width:min(430px,100%);background:rgba(21,21,29,.96);
  border:1px solid var(--border);border-radius:26px;padding:38px;
  box-shadow:0 30px 90px rgba(0,0,0,.55);
}
.logo{text-align:center;margin-bottom:28px}
.logo .icon{font-size:42px}
.logo h1{font-size:30px;margin:8px 0 5px}
.logo h1 span{color:var(--purple)}
.logo p{margin:0;color:var(--muted)}
label.field{display:block;color:#ddd;font-weight:bold;margin:18px 0 8px}
input[type=text],input[type=password]{
  width:100%;padding:14px 15px;border-radius:12px;border:1px solid var(--border);
  background:#0e0e14;color:white;outline:none;font-size:16px;
}
input[type=text]:focus,input[type=password]:focus{
  border-color:var(--purple);box-shadow:0 0 0 3px rgba(139,92,246,.12)
}
.login-btn,.logout-btn,.close-btn,.reset{
  border:0;border-radius:12px;padding:13px 18px;font-weight:bold;
  cursor:pointer;font-size:15px;transition:.2s;
}
.login-btn{
  width:100%;margin-top:24px;color:white;
  background:linear-gradient(135deg,var(--purple),var(--purple2));
}
.login-btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.error{
  display:none;margin-top:15px;padding:11px;border-radius:10px;
  background:rgba(255,77,103,.1);border:1px solid rgba(255,77,103,.25);
  color:#ff8092;text-align:center;font-size:14px;
}
.users-info{
  margin-top:24px;padding:14px;border-radius:12px;background:#101017;
  color:var(--muted);font-size:12px;text-align:center;
}

/* APP */
.app{min-height:100vh;padding:25px 0 50px}
.container{width:min(1100px,92%);margin:auto}
.topbar{
  display:flex;justify-content:space-between;align-items:center;gap:15px;
  margin-bottom:28px;padding:15px 18px;background:var(--card);
  border:1px solid var(--border);border-radius:18px;
}
.user-welcome{font-weight:bold}
.user-welcome span{color:var(--purple)}
.logout-btn{background:#292932;color:#ddd}
.logout-btn:hover{background:#383842}
header{text-align:center;margin-bottom:25px}
h1{margin:0 0 8px;font-size:clamp(2rem,5vw,3.5rem)}
h1 span{color:var(--purple)}
.subtitle{color:var(--muted);margin:0}
.week-progress{
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:18px;margin-bottom:25px
}
.progress-top{display:flex;justify-content:space-between;margin-bottom:10px;font-weight:bold}
.progress-bar{height:10px;background:#292932;border-radius:99px;overflow:hidden}
.progress-fill{
  height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--purple2));
  transition:width .3s ease
}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.day{
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  overflow:hidden;box-shadow:0 10px 35px rgba(0,0,0,.18)
}
.day-header{padding:20px 22px;border-bottom:1px solid var(--border)}
.day-header h2{margin:0 0 5px;font-size:1.7rem}
.day-header p{margin:0;color:var(--muted);font-size:.92rem;font-weight:bold}
.monday .day-header h2{color:#1677ff}.tuesday .day-header h2{color:#16b96b}
.wednesday .day-header h2{color:#ff914d}.friday .day-header h2{color:#c92d3f}
.saturday .day-header h2{color:#8b5cf6}
.exercises{padding:8px 18px 18px}
.exercise{
  display:flex;align-items:center;gap:12px;padding:13px 4px;
  border-bottom:1px solid rgba(255,255,255,.055);cursor:pointer
}
.exercise:last-child{border-bottom:0}
.exercise input{width:21px;height:21px;accent-color:var(--purple);cursor:pointer}
.exercise-info{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%}
.exercise-name{font-weight:bold;line-height:1.3}.sets{color:var(--muted);font-size:.82rem;white-space:nowrap}
.exercise.done .exercise-name{text-decoration:line-through;color:#777783}
.day-footer{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:0 22px 20px;color:var(--muted);font-size:.85rem
}
.complete-badge{display:none;color:#4ade80;font-weight:bold}
.day.completed .complete-badge{display:block}
.rest{
  grid-column:span 2;background:linear-gradient(135deg,#15151c,#101016);
  border:1px solid var(--border);border-radius:20px;padding:22px;text-align:center;color:var(--muted)
}
.reset{display:block;margin:25px auto 0;background:transparent;border:1px solid var(--border);color:var(--muted)}

/* MODAL */
.motivation{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);
  opacity:0;visibility:hidden;transition:.25s;z-index:10
}
.motivation.show{opacity:1;visibility:visible}
.motivation-card{
  width:min(480px,100%);background:#181820;border:1px solid rgba(168,85,247,.35);
  border-radius:24px;padding:32px 25px;text-align:center;
  box-shadow:0 25px 80px rgba(0,0,0,.5)
}
.motivation-icon{font-size:3rem;margin-bottom:12px}
.motivation h2{margin:0 0 10px;font-size:1.7rem}
.motivation p{color:#c8c8d0;line-height:1.6;margin-bottom:22px}
.close-btn{background:var(--purple);color:white}

@media(max-width:750px){
  .grid{grid-template-columns:1fr}.rest{grid-column:span 1}
  .container{width:94%}.login-card{padding:30px 22px}
}
@media(max-width:430px){
  .topbar{align-items:flex-start}.exercise-info{display:block}.sets{display:block;margin-top:3px}
}
</style>
</head>
<body>

<!-- TELA DE LOGIN -->
<section class="screen login-screen" id="loginScreen">
  <div class="login-card">
    <div class="logo">
      <div class="icon">🏋️</div>
      <h1>TREINO <span>PPL</span></h1>
      <p>Entre para acessar seu treino semanal</p>
    </div>

    <form id="loginForm">
      <label class="field" for="username">Usuário</label>
      <input id="username" type="text" placeholder="Digite seu nome" autocomplete="username" required>

      <label class="field" for="password">Senha</label>
      <input id="password" type="password" placeholder="Digite sua senha" autocomplete="current-password" required>

      <button class="login-btn" type="submit">ENTRAR</button>
      <div class="error" id="loginError">Usuário ou senha incorretos.</div>
    </form>

    <div class="users-info">
      Usuários cadastrados: Jonas Henrique e Kevin Luiz
    </div>
  </div>
</section>

<!-- APLICAÇÃO -->
<section class="screen app hidden" id="appScreen">
  <div class="container">

    <div class="topbar">
      <div class="user-welcome">Olá, <span id="loggedUser"></span>! 💪</div>
      <button class="logout-btn" id="logoutBtn">Sair</button>
    </div>

    <header>
      <h1>TREINO SEMANAL - <span>PPL</span></h1>
      <p class="subtitle">Marque cada exercício conforme concluir. Seu progresso fica salvo neste dispositivo.</p>
    </header>

    <section class="week-progress">
      <div class="progress-top">
        <span>Progresso da semana</span>
        <span id="progressText">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </section>

    <section class="grid" id="workoutGrid"></section>
    <button class="reset" id="resetBtn">↻ Resetar meus exercícios</button>
  </div>
</section>

<div class="motivation" id="motivation">
  <div class="motivation-card">
    <div class="motivation-icon">🔥</div>
    <h2>Treino concluído!</h2>
    <p id="motivationText"></p>
    <button class="close-btn" id="closeMotivation">Continuar</button>
  </div>
</div>

<script>
const USERS = {
  "jonas henrique": "160806",
  "kevin luiz": "240307"
};

const workouts = [
  {
    id:"segunda",day:"SEGUNDA",title:"PUSH - (PEITO, OMBRO E TRÍCEPS)",className:"monday",
    exercises:[
      ["Supino reto com barra","4x"],["Supino inclinado com barra","4x"],
      ["Crossover polia alta","3x"],["Crossover polia baixa","3x"],
      ["Elevação lateral sentado","4x"],["Desenvolvimento com halteres","4x"],
      ["Tríceps na polia","4x"]
    ]
  },
  {
    id:"terca",day:"TERÇA",title:"PULL - (COSTAS, POSTERIOR DE OMBRO E BÍCEPS)",className:"tuesday",
    exercises:[
      ["Puxada alta","4x"],["Remada baixa sentado","4x"],["Remada curvada","4x"],
      ["Remada cavalinho","3x"],["Fly inverso","3x"],["Rosca direta barra W","4x"],
      ["Rosca martelo na polia","4x"]
    ]
  },
  {
    id:"quarta",day:"QUARTA",title:"LEGS - (QUADRÍCEPS, POSTERIOR E GLÚTEOS)",className:"wednesday",
    exercises:[
      ["Agachamento livre","4x"],["Leg Press 45","4x"],["Cadeira extensora","4x"],
      ["Mesa flexora","4x"],["Stiff","4x"],["Elevação pélvica","3x"],["Panturrilha","3x"]
    ]
  },
  {
    id:"sexta",day:"SEXTA",title:"UPPER - (SUPERIOR COMPLETO)",className:"friday",
    exercises:[
      ["Supino inclinado com halteres","3x"],["Supino reto com barra","3x"],
      ["Puxada alta","3x"],["Remada baixa sentado","3x"],
      ["Encolhimento com halteres","3x"],["Elevação frontal na polia","3x"],
      ["Rosca martelo na polia","3x"],["Tríceps na polia","3x"]
    ]
  },
  {
    id:"sabado",day:"SÁBADO",title:"LOWER - (INFERIOR COMPLETO)",className:"saturday",
    exercises:[
      ["Agachamento livre","3x"],["Leg Press 45","3x"],["Mesa flexora","3x"],
      ["Stiff","3x"],["Elevação pélvica","3x"],["Panturrilha","3x"]
    ]
  }
];

const messages = [
  "Você terminou mais um treino. Disciplina vence motivação quando a motivação acaba. 🔥",
  "Mais um treino concluído! O resultado é construído exatamente assim: um treino de cada vez. 💪",
  "Missão cumprida! Você não precisa ser perfeito, só precisa continuar. 🚀",
  "Treino finalizado! Hoje você foi melhor do que ontem. Continue nessa pegada. 🏆",
  "Você fez acontecer. Consistência é o verdadeiro segredo. Agora descanse e volte ainda mais forte! ⚡"
];

let currentUser = sessionStorage.getItem("pplLoggedUser");

function storageKey(){
  return "treinoPPL_" + currentUser;
}

function getState(){
  return JSON.parse(localStorage.getItem(storageKey()) || "{}");
}

function saveState(state){
  localStorage.setItem(storageKey(), JSON.stringify(state));
}

function login(user, password){
  const normalized = user.trim().toLowerCase();
  if(USERS[normalized] === password){
    currentUser = normalized;
    sessionStorage.setItem("pplLoggedUser", currentUser);
    document.getElementById("loggedUser").textContent =
      normalized.replace(/\b\w/g, c => c.toUpperCase());
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("appScreen").classList.remove("hidden");
    render();
    return true;
  }
  return false;
}

document.getElementById("loginForm").addEventListener("submit", e=>{
  e.preventDefault();
  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;
  const error = document.getElementById("loginError");

  if(!login(user,pass)){
    error.style.display="block";
  }else{
    error.style.display="none";
  }
});

document.getElementById("logoutBtn").addEventListener("click",()=>{
  sessionStorage.removeItem("pplLoggedUser");
  currentUser = null;
  document.getElementById("appScreen").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("password").value="";
});

function render(){
  const state=getState();
  const grid=document.getElementById("workoutGrid");
  grid.innerHTML="";

  workouts.forEach(workout=>{
    const card=document.createElement("article");
    card.className=`day ${workout.className}`;

    const header=document.createElement("div");
    header.className="day-header";
    header.innerHTML=`<h2>${workout.day}</h2><p>${workout.title}</p>`;

    const exercises=document.createElement("div");
    exercises.className="exercises";

    workout.exercises.forEach((exercise,index)=>{
      const key=`${workout.id}-${index}`;
      const checked=!!state[key];
      const label=document.createElement("label");
      label.className=`exercise ${checked?"done":""}`;
      label.innerHTML=`
        <input type="checkbox" ${checked?"checked":""} data-key="${key}">
        <span class="exercise-info">
          <span class="exercise-name">${exercise[0]}</span>
          <span class="sets">${exercise[1]} séries</span>
        </span>`;
      exercises.appendChild(label);
    });

    const total=workout.exercises.length;
    const done=workout.exercises.filter((_,i)=>state[`${workout.id}-${i}`]).length;

    const footer=document.createElement("div");
    footer.className="day-footer";
    footer.innerHTML=`<span>${done}/${total} exercícios concluídos</span>
      <span class="complete-badge">✓ TREINO CONCLUÍDO</span>`;

    card.append(header,exercises,footer);
    grid.appendChild(card);
    if(done===total) card.classList.add("completed");
  });

  document.querySelectorAll('#workoutGrid input[type="checkbox"]').forEach(input=>{
    input.addEventListener("change",handleCheck);
  });
  updateProgress();
}

function handleCheck(e){
  const input=e.target;
  const state=getState();
  state[input.dataset.key]=input.checked;
  saveState(state);
  input.closest(".exercise").classList.toggle("done",input.checked);

  const workout=workouts.find(w=>input.dataset.key.startsWith(w.id+"-"));
  const complete=workout.exercises.every((_,i)=>state[`${workout.id}-${i}`]);
  const card=document.querySelector(`.${workout.className}`);
  card.classList.toggle("completed",complete);

  if(complete) showMotivation();
  render();
}

function updateProgress(){
  const state=getState();
  const total=workouts.reduce((sum,w)=>sum+w.exercises.length,0);
  const done=workouts.reduce((sum,w)=>sum+w.exercises.filter((_,i)=>state[`${w.id}-${i}`]).length,0);
  const percent=total?Math.round(done/total*100):0;
  document.getElementById("progressText").textContent=percent+"%";
  document.getElementById("progressFill").style.width=percent+"%";
}

function showMotivation(){
  document.getElementById("motivationText").textContent=
    messages[Math.floor(Math.random()*messages.length)];
  document.getElementById("motivation").classList.add("show");
}

document.getElementById("closeMotivation").addEventListener("click",()=>{
  document.getElementById("motivation").classList.remove("show");
});

document.getElementById("motivation").addEventListener("click",e=>{
  if(e.target.id==="motivation") e.currentTarget.classList.remove("show");
});

document.getElementById("resetBtn").addEventListener("click",()=>{
  if(confirm("Tem certeza que deseja resetar seus exercícios?")){
    localStorage.removeItem(storageKey());
    render();
  }
});

if(currentUser && USERS[currentUser]){
  document.getElementById("loggedUser").textContent=
    currentUser.replace(/\b\w/g,c=>c.toUpperCase());
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("appScreen").classList.remove("hidden");
  render();
}
</script>
</body>
</html>
